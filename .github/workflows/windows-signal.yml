name: Windows signal

# Issue #56 is a Windows-vs-macOS LAN failure: the everyday suite runs on macOS,
# so this is the only per-push Windows evidence. Scope is deliberately small —
# a private repo spends Actions minutes at a 2x multiplier for Windows runners,
# and only the socket/LAN surface is platform-sensitive here.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-lan:
    name: LAN surface on real Windows
    # Keep the compiler image compatible with the pinned CMake 3.31 toolchain.
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cmake==3.31.6
      - name: netdiag on real Windows
        # Exercises the real entry point: environment, local addresses, the
        # observe-this-platform socket probes and a real host+join pairing.
        run: python main.py --netdiag info --out netdiag-windows.json
      - name: Show the report
        run: Get-Content netdiag-windows.json
      - name: Dump the scene states on Windows
        # The exact structure the lockstep checksum hashes: when two platforms
        # report different checksums, diffing these dumps names the value instead
        # of leaving "checksums differ" as the whole diagnosis. Ticks 0 separates
        # scene construction from the step itself, and `--scene contact` covers the
        # collision/weapon maths that the strategic canonical scene never reaches.
        run: |
          python tools/lan_state_diff.py dump --out state-win-ticks0.json
          python tools/lan_state_diff.py dump --out state-win-ticks1.json --ticks 1
          python tools/lan_state_diff.py dump --out state-win-contact-ticks60.json --scene contact --ticks 60
      - name: Focused LAN tests on Windows
        env:
          PYTHONPATH: tests
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
          TMPDIR: ${{ runner.temp }}
          # Pacing is hardware acceptance, not correctness: this shared 2-vCPU
          # runner paced 20.9 ticks/s against the 27 ticks/s LAN floor. The floor
          # is lowered here and the correctness clauses (identical checksums every
          # tick, all ticks executed, AI and human commands present) still gate;
          # the real floor is measured on the reporter's own PC.
          STAR_ARMADA_PACING_FLOOR: "15"
        # test_lan.DiagnosticTests runs the real two-process LAN diagnostic here
        # too: cross-process determinism must hold on Windows, not only on macOS.
        # Portable foundation + production backend recovery checks use real TCP.
        # Handoff/UI modules additionally require real GL; do not run their GL
        # assertions under dummy video or silently skip them in this job.
        # test_station_balance is dummy-safe (2D screens only, no GL context) and
        # is the only place the Game Balance file path is exercised on Windows:
        # %APPDATA% persistence across a catalogue rebuild, the overlay reaching
        # the live rules, the build-level gate, and a real-TCP pair adopting the
        # host's tuning. Its screen tests build real MenuStack frames, so they
        # assert layout rather than pixels and need no GL driver.
        # Collection-point commands and recovery admission/launch regressions are
        # portable real-TCP gates. Localization tests also exercise native Cyrillic
        # font rendering and settings persistence without requiring an OpenGL context.
        run: python -m unittest test_netdiag test_netdiag_compare test_lan_state_diff test_sim_profiles test_lan test_multiplayer test_checksum_canonicalization test_orbit_spacing_batch test_render_camera test_render_live test_render_single_path test_lan_human_safety test_lan_failure_diagnostics test_lan_reconnect test_lan_production_reconnect test_lan_reconnect_admission test_lan_launch_recovery test_station_balance test_collection_points test_collection_points_lan test_i18n test_i18n_russian test_language_tools test_lan_eight_players test_lan_deployment_ui test_lan_language test_release_packaging test_native_binary_discovery test_render_default test_native_worker_entry test_native_worker test_native_worker_main_boundary test_native_worker_parent_identity -v
      - name: Replay deletion on real Windows
        env:
          PYTHONPATH: tests
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        # Real kernel tests cover handles, junctions, locked files and all-file
        # deletion; portable mocks are not evidence of native syscall safety.
        run: |
          python -c "import os, unittest; assert os.name == 'nt', 'Native Windows deletion gate requires Windows'; suite = unittest.defaultTestLoader.loadTestsFromName('test_replay_deletion_windows.NativeWindowsDeletionTests'); expected = suite.countTestCases(); result = unittest.TextTestRunner(verbosity=2).run(suite); optional = 'test_file_symlink_is_never_deleted_or_followed'; raise SystemExit(0 if result.wasSuccessful() and result.testsRun == expected and all(test._testMethodName == optional for test, reason in result.skipped) else 1)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest test_replay_deletion_windows test_replay_library -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netdiag-windows
          path: |
            netdiag-windows.json
            state-win-ticks0.json
            state-win-ticks1.json
            state-win-contact-ticks60.json

  package-windows:
    needs: windows-lan
    # Manual runs only: hands the reporter a candidate build (an artifact, never
    # a published release) to re-test the pairing on the real PC.
    name: Candidate Windows package (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    env:
      # build_native_release.py preserves caches and delegates generator choice
      # to CMake; fresh CI must not default to NMake without a developer shell.
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.20.0 cmake==3.31.6
      - name: Build and test mandatory native renderer (Release)
        timeout-minutes: 25
        run: python tools/build_native_release.py --build-dir render_cpp/build-w02
      - name: Packaging contract tests
        run: python -m unittest discover -s tests -p test_release_packaging.py -v
      - name: Build exe
        run: pyinstaller star_armada.spec --noconfirm
      - name: Validate frozen native payload
        run: python tools/build_native_release.py --validate-frozen "dist/STAR ARMADA/_internal"
      - name: Exercise frozen renderer worker and native ABI (no GPU)
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()))
          from game import __version__
          exe = pathlib.Path('dist/STAR ARMADA/STAR ARMADA.exe').resolve()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-worker-probe.json'
          assert not output.exists(), 'Refusing stale probe output'
          env = dict(os.environ)
          env.pop('STAR_ARMADA_CPP_LIBRARY', None)
          subprocess.run([str(exe), '--native-render-worker', '--probe', '--output', str(output)],
                         env=env, check=True, timeout=60)
          report = json.loads(output.read_text(encoding='utf-8'))
          assert report['status'] == 'ok' and report['abi'] == 1
          assert report['frozen'] is True and report['version'] == __version__
          expected = exe.parent / '_internal/cpp/armada_embedded.dll'
          assert pathlib.Path(report['native_library']).resolve() == expected.resolve()
          print(json.dumps(report, indent=2))
      - name: Zip
        run: |
          Compress-Archive -Path "dist/STAR ARMADA/*" `
            -DestinationPath "dist/STAR-ARMADA-candidate-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: star-armada-candidate-win
          path: dist/STAR-ARMADA-candidate-win.zip
          if-no-files-found: error
