name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          ./.venv/bin/pip install -r requirements.txt pyinstaller==6.20.0 cmake==3.31.6
      - name: Build and test mandatory native renderer (Release)
        timeout-minutes: 25
        run: PATH="$PWD/.venv/bin:$PATH" ./.venv/bin/python tools/build_native_release.py --build-dir render_cpp/build-w02
      - name: Packaging contract tests
        run: ./.venv/bin/python -m unittest discover -s tests -p test_release_packaging.py -v
      - name: macOS bundle asset-root regression tests
        run: ./.venv/bin/python -m unittest discover -s tests -p test_macos_bundle_assets.py -v
      - name: Build app + DMG
        run: |
          ./.venv/bin/pyinstaller star_armada.spec --noconfirm
          ./.venv/bin/python tools/build_native_release.py --validate-frozen "dist/STAR ARMADA.app/Contents/Frameworks"
          codesign --force --deep --sign - "dist/STAR ARMADA.app"
          mkdir -p dist/dmg_staging
          cp -R "dist/STAR ARMADA.app" dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "STAR ARMADA" -srcfolder dist/dmg_staging \
            -ov -format UDZO "dist/STAR-ARMADA-${GITHUB_REF_NAME}-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/STAR-ARMADA-*-mac.dmg
          if-no-files-found: error

  win:
    # CMake 3.31 supports VS 2022, not windows-latest's moving VS 2026 image.
    runs-on: windows-2022
    env:
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_GENERATOR_PLATFORM: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.20.0 cmake==3.31.6
      - name: Build and test mandatory native renderer (Release)
        timeout-minutes: 25
        run: python tools/build_native_release.py --build-dir render_cpp/build-w02
      - name: Packaging contract tests
        run: python -m unittest discover -s tests -p test_release_packaging.py -v
      - name: Build exe
        run: pyinstaller star_armada.spec --noconfirm
      - name: Validate frozen native payload
        run: python tools/build_native_release.py --validate-frozen "dist/STAR ARMADA/_internal"
      - name: Exercise frozen renderer worker and native ABI (no GPU)
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()))
          from game import __version__
          exe = pathlib.Path('dist/STAR ARMADA/STAR ARMADA.exe').resolve()
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-worker-probe.json'
          assert not output.exists(), 'Refusing stale probe output'
          env = dict(os.environ)
          env.pop('STAR_ARMADA_CPP_LIBRARY', None)
          subprocess.run([str(exe), '--native-render-worker', '--probe', '--output', str(output)],
                         env=env, check=True, timeout=60)
          report = json.loads(output.read_text(encoding='utf-8'))
          assert report['status'] == 'ok' and report['abi'] == 1
          assert report['frozen'] is True and report['version'] == __version__
          expected = exe.parent / '_internal/cpp/armada_embedded.dll'
          assert pathlib.Path(report['native_library']).resolve() == expected.resolve()
          print(json.dumps(report, indent=2))
      - name: Zip
        run: |
          Compress-Archive -Path "dist/STAR ARMADA/*" `
            -DestinationPath "dist/STAR-ARMADA-${env:GITHUB_REF_NAME}-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: win-zip
          path: dist/STAR-ARMADA-*-win.zip
          if-no-files-found: error

  release:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "STAR ARMADA ${{ github.ref_name }}"
          body: |
            First playable release of STAR ARMADA.

            - macOS: download the DMG, open it, drag the app to Applications.
              First launch: right-click the app → Open (unsigned build).
            - Windows: download the ZIP, extract, run `STAR ARMADA.exe`.
          files: |
            artifacts/mac-dmg/*
            artifacts/win-zip/*